name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  semver:
    # Versions follow Semantic Versioning 2.0.0; tags are v + a valid SemVer version.
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'
          if [[ ! "$TAG" =~ $re ]]; then
            echo "::error::Tag '$TAG' is not v + a Semantic Versioning 2.0.0 version (e.g. v1.4.2, v2.0.0-rc.1)."
            exit 1
          fi

  ci:
    # Full CI (checks, unit, integration and e2e tests) must pass before anything is published.
    needs: semver
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  binaries:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CGO_ENABLED: "0"
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build frontend
        run: npm --prefix web ci && npm --prefix web run build
      - name: Build binaries
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            name="dviz_${VERSION}_${os}_${arch}"
            mkdir -p "build/$name"
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "build/$name/dviz" ./cmd/dviz
            cp LICENSE README.md "build/$name/"
            tar -C build -czf "dist/$name.tar.gz" "$name"
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
          file build/*/dviz
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A SemVer prerelease has a "-" before any "+build" metadata.
          core="${VERSION%%+*}"
          prerelease=""
          [[ "$core" == *-* ]] && prerelease="--prerelease"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
          else
            gh release create "$VERSION" dist/* --verify-tag --generate-notes --title "$VERSION" $prerelease
          fi

  image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Log in to ghcr.io
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push multi-arch image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${VERSION#v}"
          # Docker tags cannot contain "+"; SemVer build metadata is kept with "_" instead.
          tags=(-t "$image:${version//+/_}")
          # Stable releases (no prerelease part) also move the major, minor and latest tags.
          if [[ "${version%%+*}" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            tags+=(-t "$image:${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" -t "$image:latest")
            # In 0.y.z any minor release may break compatibility, so there is no "0" tag.
            [[ "${BASH_REMATCH[1]}" != 0 ]] && tags+=(-t "$image:${BASH_REMATCH[1]}")
          fi
          docker buildx create --use --driver docker-container
          docker buildx build . --push \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$VERSION" \
            "${tags[@]}" \
            --label org.opencontainers.image.source="${{ github.server_url }}/${{ github.repository }}" \
            --label org.opencontainers.image.version="$version" \
            --label org.opencontainers.image.revision="${{ github.sha }}" \
            --label org.opencontainers.image.description="Interactive 3D view of Docker hosts"
